ic="true" data-astro-cid-ac66eqjo>Enter a query to start searching.</p><ol id="search-results" class="search-results" data-astro-cid-ac66eqjo></ol><noscript><p data-astro-cid-ac66eqjo>Site search requires JavaScript.</p></noscript></section><script type="module">
  /**
   * This stays inline so Vite does not try to resolve Pagefind before its
   * post-build bundle exists in /pagefind/.
   * @typedef {{url: string, excerpt: string, meta: Record<string, string | undefined>}} PagefindData
   */

  const root = document.querySelector('[data-search-root]');
  const form = root?.querySelector('.search-form');
  const input = root?.querySelector('#search-input');
  const status = root?.querySelector('#search-status');
  const results = root?.querySelector('#search-results');
  let pagefindPromise;
  let searchAttempt = 0;

  function message(name, fallback) {
    return root?.dataset[name] ?? fallback;
  }

  function loadPagefind() {
    if (!pagefindPromise) {
      pagefindPromise = import('/pagefind/pagefind.js').then((pagefind) => {
        void pagefind.init();
        return pagefind;
      });
    }
    return pagefindPromise;
  }

  function formatResultDate(value) {
    if (!value) return '';
    const date = new Date(value);
    if (Number.isNaN(date.valueOf())) return '';
    return new Intl.DateTimeFormat(root?.dataset.lang === 'en' ? 'en-US' : 'zh-CN', {
      year: 'numeric',
      month: 'long',
      day: 'numeric',
      timeZone: 'UTC',
    }).format(date);
  }

  function appendSafeExcerpt(target, html) {
    const template = document.createElement('template');
    template.innerHTML = html;

    function appendChildren(source, destination) {
      source.childNodes.forEach((node) => {
        if (node.nodeType === Node.TEXT_NODE) {
          destination.append(document.createTextNode(node.textContent ?? ''));
          return;
        }
        if (!(node instanceof HTMLElement)) return;
        const childDestination = node.tagName === 'MARK'
          ? document.createElement('mark')
          : document.createDocumentFragment();
        appendChildren(node, childDestination);
        destination.append(childDestination);
      });
    }

    appendChildren(template.content, target);
  }

  /** @param {PagefindData} result */
  function renderResult(result) {
    const item = document.createElement('li');
    const heading = document.createElement('h2');
    const link = document.createElement('a');
    const metadata = document.createElement('p');
    const description = document.createElement('p');
    const excerpt = document.createElement('p');

    link.href = result.url;
    link.textContent = result.meta.title ?? message('messageUntitled', 'Untitled page');
    heading.append(link);

    metadata.className = 'search-result__meta';
    const date = formatResultDate(result.meta.date);
    metadata.textContent = [result.meta.type, date].filter(Boolean).join(' · ');

    description.className = 'search-result__description';
    description.textContent = result.meta.description ?? '';

    excerpt.className = 'search-result__excerpt';
    appendSafeExcerpt(excerpt, result.excerpt);

    item.append(heading, metadata);
    if (description.textContent) item.append(description);
    item.append(excerpt);
    return item;
  }

  async function performSearch(query) {
    if (!status || !results) return;
    const attempt = ++searchAttempt;
    const normalizedQuery = query.trim();
    results.replaceChildren();

    if (!normalizedQuery) {
      status.textContent = message('messageStart', 'Enter a query to start searching.');
      return;
    }

    status.textContent = message('messageLoading', 'Searching…');

    try {
      const pagefind = await loadPagefind();
      if (attempt !== searchAttempt) return;
      const response = await pagefind.debouncedSearch(normalizedQuery, {}, 180);
      if (!response || attempt !== searchAttempt) return;
      const data = await Promise.all(response.results.map((result) => result.data()));
      if (attempt !== searchAttempt) return;
      results.append(...data.map(renderResult));
      status.textContent = data.length > 0
        ? message('messageFound', '{count} results found.').replace('{count}', String(data.length))
        : message('messageNone', 'No matching content found.');
    } catch {
      if (attempt !== searchAttempt) return;
      status.textContent = message('messageFailure', 'The search index is not available.');
    }
  }

  if (form && input) {
    const initialQuery = new URLSearchParams(window.location.search).get('q') ?? '';
    input.value = initialQuery;
    if (initialQuery) void performSearch(initialQuery);

    input.addEventListener('focus', () => {
      void loadPagefind().catch(() => undefined);
    }, { once: true });

    input.addEventListener('input', () => {
      const url = new URL(window.location.href);
      if (input.value.trim()) url.searchParams.set('q', input.value.trim());
      else url.searchParams.delete('q');
      window.history.replaceState({}, '', url);
      void performSearch(input.value);
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      void performSearch(input.value);
    });
  }
</script></main><footer class="site-footer" data-pagefind-ignore="all"><div class="site-footer__inner"><p><a href="https://creativecommons.org/licenses/by-nc/4.0/" rel="license">CC BY-NC 4.0</a></p></div></footer></div></body></html>
